server {
    listen 80;
    listen [::]:80;
    server_name tasklists.aggregat4.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tasklists.aggregat4.net;

    include /etc/nginx/snippets/a4-tls.conf;
    access_log /var/log/nginx/tasklists.access.log combined;

    location / {
        proxy_pass http://127.0.0.1:9085;
        include /etc/nginx/snippets/a4-proxy-headers.conf;
    }

    location /sync/events {
        proxy_pass http://127.0.0.1:9085;
        include /etc/nginx/snippets/a4-proxy-headers.conf;
        include /etc/nginx/snippets/a4-sse.conf;
    }
}
