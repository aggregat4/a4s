server {
    listen 80;
    listen [::]:80;
    server_name openidprovider.aggregat4.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name openidprovider.aggregat4.net;

    include /etc/nginx/snippets/a4-tls.conf;
    access_log /var/log/nginx/openidprovider.access.log combined;

    location / {
        proxy_pass http://127.0.0.1:1301;
        include /etc/nginx/snippets/a4-proxy-headers.conf;
    }

    location /login {
        limit_req zone=a4_login;
        proxy_pass http://127.0.0.1:1301;
        include /etc/nginx/snippets/a4-proxy-headers.conf;
    }
}
