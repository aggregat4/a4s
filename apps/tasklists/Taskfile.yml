version: '3'

tasks:
  build:
    desc: Build the Tasklists client and server
    cmds:
      - pnpm --dir client run build
      - go build ./server/...
  test:
    desc: Run the Tasklists server, client, and browser tests
    cmds:
      - go test ./server/...
      - task: test:client
  test:client:
    desc: Build the client and run its unit and browser tests
    cmds:
      - pnpm --dir client test
