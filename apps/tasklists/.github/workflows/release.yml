name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: GOCACHE=/tmp/go-build go test ./...

      - name: Run client unit tests
        working-directory: client
        run: npm run test:unit

      - name: Install Playwright Browsers
        working-directory: client
        run: npx playwright install --with-deps

      - name: Run client E2E tests
        working-directory: client
        run: npm run test:e2e

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Package release artifact
        run: |
          ./scripts/package-release.sh \
            "${{ github.event.release.tag_name }}" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a4-tasklists-${{ matrix.suffix }}
          path: |
            artifacts/a4-tasklists-${{ github.event.release.tag_name }}-${{ matrix.suffix }}.tar.gz
            artifacts/a4-tasklists-${{ github.event.release.tag_name }}-${{ matrix.suffix }}.tar.gz.sha256
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*
