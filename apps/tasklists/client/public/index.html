<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#dedede" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Tasklists" />
        <title>A4 Tasklists</title>
        <link rel="stylesheet" href="./styles.css" />
        <link rel="manifest" href="./manifest.json" />
        <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
        <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    </head>
    <body>
        <a4-lists-app data-role="lists-app"></a4-lists-app>
        <script type="module">
            import { bootstrapListsApp } from "./entrypoints/main.js";
            import { SEED_LIST_CONFIGS } from "./entrypoints/demo-seeds.js";

            bootstrapListsApp({ seedConfigs: SEED_LIST_CONFIGS });
        </script>
        <script type="module">
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("./sw.js").catch(function (err) {
                    console.error("Service Worker registration failed:", err);
                });
            }
        </script>
    </body>
</html>
