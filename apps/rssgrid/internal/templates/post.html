<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head" (printf "%s - RSSGrid" .Post.Title)}}
</head>
<body class="post-page">
    <div class="post-dialog">
        <div class="post-dialog-header">
            <div class="post-header-content">
                <h1 class="post-title">{{.Post.Title}}</h1>
                <div class="post-meta">
                    {{if not .Post.PublishedAt.IsZero}}
                    <span class="post-date">{{.Post.PublishedAt.Format "January 2, 2006 at 3:04 PM"}}</span>
                    {{end}}
                </div>
            </div>
            <div class="post-actions">
                <a href="{{.Post.Link}}" target="_blank" class="btn btn-primary" title="View original post">View</a>
                <a href="/" class="btn btn-secondary" id="closePost">Close</a>
            </div>
        </div>
        <div class="post-content">
            {{if .Post.Content}}
                {{.Post.Content}}
            {{else}}
                <p>No content available for this post.</p>
            {{end}}
        </div>
    </div>

    <script>
        // Inside the dashboard's dialog, closing hands control back to the
        // dashboard. Opened on its own, Close is a link to the dashboard.
        if (window.parent !== window) {
            const close = () => window.parent.postMessage({ type: 'closeDialog' }, location.origin);
            document.getElementById('closePost').addEventListener('click', (e) => {
                e.preventDefault();
                close();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    close();
                }
            });
        }
    </script>
</body>
</html>
