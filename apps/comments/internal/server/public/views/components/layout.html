{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}}</title>
    {{range .Data.Stylesheets}}    
    <link rel="stylesheet" href="{{call $.AssetPath .}}">
    {{end}}
    {{range .Data.Scripts}}
    <script src="{{call $.AssetPath .}}" defer></script>
    {{end}}
</head>
<body class="{{template "bodyClass" .}}">
    {{template "content" .}}

    <script>
        function updateParentHeight() {
            const height = document.body.scrollHeight;
            window.parent.postMessage({
                type: 'comment-height',
                height: height
            }, '*');
        }
        
        function openAuthPopup() {
            const popup = window.open('/login', 'auth-popup', 'width=500,height=600,scrollbars=yes,resizable=yes');
            
            // Listen for messages from the popup
            window.addEventListener('message', function(e) {
                if (e.data && e.data.type === 'auth-success') {
                    popup.close();
                    // Refresh the current page to show authenticated state
                    window.location.reload();
                }
            });
            
            // Check if popup was blocked
            if (!popup || popup.closed || typeof popup.closed === 'undefined') {
                alert('Please allow popups for this site to authenticate.');
            }
        }
        
        // Update on load and when content changes
        window.addEventListener('load', updateParentHeight);
        const observer = new MutationObserver(updateParentHeight);
        observer.observe(document.body, { 
            childList: true, 
            subtree: true 
        });
      </script>      
</body>
</html>
{{end}}
