on:
  release:
    types: [created]

name: Create and Upload Release Artifact

jobs:
  generate:
    name: Create release-artifacts
    runs-on: ubuntu-22.04
    steps:
      - name: Get the release version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: Install Chromium for E2E tests
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
      - name: Build
        run: scripts/build.sh
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Test
        run: scripts/test.sh
      - name: Test including E2E
        run: scripts/test-e2e.sh
        env:
          CHROME_PATH: /usr/bin/chromium-browser
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.2.0 ./...
      - name: Package the Release Artifacts
        run: >-
          tar -zcf go-comments-${{ env.RELEASE_VERSION }}-linux-amd64.tar.gz
          -C bin
          gocomments-server
          gocomments-createencryptionkey
          gocomments-createservice
      - name: Upload the Artifacts
        uses: skx/github-action-publish-binaries@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: go-comments-*
