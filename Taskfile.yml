version: '3'

includes:
  rssgrid:
    taskfile: ./apps/rssgrid/Taskfile.yml
    dir: ./apps/rssgrid
  bookmarks:
    taskfile: ./apps/bookmarks/Taskfile.yml
    dir: ./apps/bookmarks
  comments:
    taskfile: ./apps/comments/Taskfile.yml
    dir: ./apps/comments
  idp:
    taskfile: ./apps/idp/Taskfile.yml
    dir: ./apps/idp
  tasklists:
    taskfile: ./apps/tasklists/Taskfile.yml
    dir: ./apps/tasklists

tasks:
  default:
    desc: List available repository tasks
    cmds:
      - task --list
  build:
    desc: Build all applications
    cmds:
      - task rssgrid:build
      - task bookmarks:build
      - task comments:build
      - task idp:build
      - task tasklists:build
  package:
    desc: Build one versioned deployment archive and checksum
    requires:
      vars: [APP, VERSION]
    vars:
      TARGET_GOOS: '{{.GOOS | default "linux"}}'
      TARGET_GOARCH: '{{.GOARCH | default "amd64"}}'
      TARGET_OUTPUT_DIR: '{{.OUTPUT_DIR | default "dist/releases"}}'
    cmds:
      - >-
        scripts/package-release.sh
        '{{.APP}}'
        '{{.VERSION}}'
        '{{.TARGET_GOOS}}'
        '{{.TARGET_GOARCH}}'
        '{{.TARGET_OUTPUT_DIR}}'
  test:
    desc: Run all shared and application test suites
    cmds:
      - go test ./pkg/...
      - task rssgrid:test
      - task bookmarks:test
      - task comments:test
      - task idp:test
      - task tasklists:test
  lint:
    desc: Run repository lint and static checks
    cmds:
      - bash scripts/check-gofmt
      - bash scripts/check-deploy
      - bash scripts/check-changelog
      - bash -n scripts/package-release.sh
      - bash -n scripts/changelog-notes.sh
      - go vet -tags=fts5 ./...
      - pnpm --filter a4-tasklists run build
  modernize:
    desc: Report Go modernization opportunities without changing source
    cmds:
      - go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@v0.23.0 -test ./...
  security:
    desc: Verify the module graph and scan reachable vulnerabilities
    cmds:
      - go mod verify
      - go run golang.org/x/vuln/cmd/govulncheck@v1.2.0 ./...
  ci:
    desc: Run lint, security checks, tests, and builds sequentially
    cmds:
      - task lint
      - task security
      - task test
      - task build
  check:
    desc: Alias for the full CI task
    cmds:
      - task ci
