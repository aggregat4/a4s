name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The Go checks and the Tasklists suites share nothing but the checkout, so
# they run as two jobs side by side.
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Go Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Run Go checks, tests and builds
        run: task ci:go

  tasklists:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter a4-tasklists exec playwright install --with-deps --only-shell chromium
      - name: Install Go Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - name: Run Tasklists builds and tests
        run: task ci:tasklists
      - name: Upload Tasklists test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tasklists-test-results
          path: apps/tasklists/client/test-results
          if-no-files-found: ignore
          retention-days: 14
